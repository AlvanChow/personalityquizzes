<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    App icon source. Rendered to PNG by `npm run assets` (scripts/generate-assets.mjs).

    Deliberately full-bleed and fully opaque: iOS applies its own rounded-rect
    mask, and the App Store rejects an icon containing an alpha channel.

    The palette is the site's own — the dark-mode gradient from src/index.css
    (#15141d → #1a1730) under the coral and sky ambient glows, with the ✨ that
    serves as the site favicon rendered as the mark.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#15141d"/>
      <stop offset="45%"  stop-color="#181624"/>
      <stop offset="100%" stop-color="#1a1730"/>
    </linearGradient>

    <radialGradient id="coralGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF8A5C" stop-opacity="0.42"/>
      <stop offset="65%"  stop-color="#FF8A5C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF8A5C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3B9AE5" stop-opacity="0.34"/>
      <stop offset="65%"  stop-color="#3B9AE5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#3B9AE5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sparkMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB08E"/>
      <stop offset="55%"  stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#F06830"/>
    </linearGradient>

    <linearGradient id="sparkSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#B6D9F7"/>
      <stop offset="100%" stop-color="#3B9AE5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <circle cx="196" cy="180" r="520" fill="url(#coralGlow)"/>
  <circle cx="880" cy="900" r="470" fill="url(#skyGlow)"/>

  <!--
    Four-point star. Each arm is a quadratic curve pulled toward the centre,
    which is what gives the sparkle its concave waist rather than a flat
    diamond. Drawn about (512,512) with a 300px arm.
  -->
  <g transform="translate(512 496)">
    <path d="M 0 -300 Q 34 -104 106 -68 L 300 0 L 106 68 Q 34 104 0 300
             Q -34 104 -106 68 L -300 0 L -106 -68 Q -34 -104 0 -300 Z"
          fill="url(#sparkMain)"/>
  </g>

  <!-- Two attendant sparks, echoing the ✨ glyph's three-star arrangement. -->
  <g transform="translate(760 300) scale(0.30)">
    <path d="M 0 -300 Q 34 -104 106 -68 L 300 0 L 106 68 Q 34 104 0 300
             Q -34 104 -106 68 L -300 0 L -106 -68 Q -34 -104 0 -300 Z"
          fill="url(#sparkSky)"/>
  </g>
  <g transform="translate(292 748) scale(0.22)">
    <path d="M 0 -300 Q 34 -104 106 -68 L 300 0 L 106 68 Q 34 104 0 300
             Q -34 104 -106 68 L -300 0 L -106 -68 Q -34 -104 0 -300 Z"
          fill="#FFD0BA" fill-opacity="0.85"/>
  </g>
</svg>
