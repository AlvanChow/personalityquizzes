<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!--
    Launch screen source. Rendered to PNG by `npm run assets`.

    Square and oversized on purpose: the LaunchScreen storyboard shows this one
    image with `scaleAspectFill`, so a 2732×2732 canvas covers every device
    aspect ratio with the mark still centred. Keep the mark well inside the
    middle third — everything outside it gets cropped on tall phones.

    The background matches `ios.backgroundColor` in capacitor.config.json and
    the dark-mode <body> gradient, so there is no seam when the splash hands
    over to the web view.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#15141d"/>
      <stop offset="45%"  stop-color="#181624"/>
      <stop offset="100%" stop-color="#1a1730"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FF8A5C" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#FF8A5C" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF8A5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3B9AE5" stop-opacity="0.26"/>
      <stop offset="70%"  stop-color="#3B9AE5" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3B9AE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFB08E"/>
      <stop offset="55%"  stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#F06830"/>
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#ground)"/>
  <circle cx="620" cy="600" r="1500" fill="url(#coralGlow)"/>
  <circle cx="2200" cy="2200" r="1400" fill="url(#skyGlow)"/>

  <g transform="translate(1366 1366) scale(1.05)">
    <path d="M 0 -300 Q 34 -104 106 -68 L 300 0 L 106 68 Q 34 104 0 300
             Q -34 104 -106 68 L -300 0 L -106 -68 Q -34 -104 0 -300 Z"
          fill="url(#sparkMain)"/>
  </g>
</svg>
